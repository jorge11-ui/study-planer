# StudyJournal no Render — sync privado com a conta única.
#
# 1. No dashboard do Render: New → Blueprint → aponta para este repo.
# 2. Define SYNC_USER e SYNC_PASS no dashboard para proteger os dados
#    e sincronizar apenas os teus dispositivos autenticados.
# 3. O plano free tem disco efémero: um restart pode apagar o sync
#    (data/sync.json). Para manter os dados, configura armazenamento
#    persistente no Render antes de usar isto com dados importantes.

services:
  - type: web
    name: study-journal
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: SYNC_USER
        sync: false
      - key: SYNC_PASS
        sync: false
    # Descomenta o disco (e usa plano Starter ou superior) para o sync
    # sobreviver a restarts/redeploys. Sem isto, o free apaga data/.
    # disk:
    #   name: study-data
    #   mountPath: /opt/render/project/src/data
    #   sizeGB: 1
