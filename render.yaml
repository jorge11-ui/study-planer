# StudyJournal no Render — PostgreSQL para dados persistentes.
#
# 1. No dashboard do Render: New → Blueprint → aponta para este repo.
# 2. Define SYNC_USER e SYNC_PASS no dashboard (obrigatórios; a app falha
#    no arranque sem autenticação para dados pessoais).
# 3. Cria uma base PostgreSQL no Render e associa a variável DATABASE_URL.
#    O serviço falha no arranque se o Render não tiver DATABASE_URL.

services:
  - type: web
    name: study-journal
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: SYNC_USER
        sync: false
      - key: SYNC_PASS
        sync: false
      - key: DATABASE_URL
        sync: false
